name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build-time-only throwaway SQLite — no real credentials in CI.
      DATABASE_URL: "file:/tmp/ci.db"
      MSAADA_SESSION_SECRET: "ci-only-not-a-real-secret-0123456789abcdef"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Typecheck (tsc --noEmit)
        run: bunx tsc --noEmit

      - name: Lint (eslint)
        run: bunx eslint .

      - name: Build (next build, Turbopack)
        run: bun run build
